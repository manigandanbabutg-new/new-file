</head>
<body>

```
<h2>AI Text Generator</h2>

<textarea
    id="prompt"
    placeholder="Enter your prompt">
</textarea>

<br>

<button onclick="generateText()">
    Generate
</button>

<div id="result"></div>

<script>

    async function generateText(){

        const prompt =
        document.getElementById("prompt").value;

        if(!prompt){
            alert("Please enter a prompt");
            return;
        }

        document.getElementById("result")
        .innerHTML = "Generating...";

        try{

            const response = await fetch(
                "https://new-file-67ps.onrender.com/generate",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        prompt:prompt
                    })
                }
            );

            const data = await response.json();

            document.getElementById("result")
            .innerHTML = data.output || data.error;

        }catch(error){

            document.getElementById("result")
            .innerHTML =
            "Error: " + error.message;
        }
    }

</script>
```

</body>
</html>
